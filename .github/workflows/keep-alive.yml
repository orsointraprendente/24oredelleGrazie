name: keep-alive

on:
  schedule:
    - cron: "0 6 */6 * *"   # alle 06:00 UTC, ogni 6 giorni circa
  workflow_dispatch:         # permette di lanciarlo a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Interroga Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/partite?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
