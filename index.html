 <script>
    /** AudioContext condiviso, creato una volta sola */
    let _audioCtx = null;

    function getAudioCtx() {
        if (!_audioCtx) {
            _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (_audioCtx.state === 'suspended') {
            _audioCtx.resume();
        }
        return _audioCtx;
    }

    /** Sblocca l'audio al primo tocco dell'utente */
    document.addEventListener('touchstart', function unlockAudio() {
        getAudioCtx();
        document.removeEventListener('touchstart', unlockAudio);
    }, { once: true });

    document.addEventListener('click', function unlockAudioClick() {
        getAudioCtx();
        document.removeEventListener('click', unlockAudioClick);
    }, { once: true });

    /** Beep breve (880 Hz) — ultimi 15 secondi */
    function creaBeep() {
        try {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 880; osc.type = 'sine';
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
            osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.15);
        } catch(e) { console.log('Errore beep:', e); }
    }

    /** Fischio lungo (2000 Hz) — fine tempo */
    function creaFischio() {
        try {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 2000; osc.type = 'sine';
            gain.gain.setValueAtTime(0.5, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
            osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.8);
        } catch(e) { console.log('Errore fischio:', e); }
    }

    /** Doppio beep (660 Hz) — 1 minuto alla fine */
    function creaAvvisoMinuto() {
        try {
            const ctx = getAudioCtx();
            [0, 0.35].forEach(delay => {
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = 660; osc.type = 'sine';
                gain.gain.setValueAtTime(0.4, ctx.currentTime + delay);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.25);
                osc.start(ctx.currentTime + delay); osc.stop(ctx.currentTime + delay + 0.25);
            });
        } catch(e) { console.log('Errore avviso minuto:', e); }
    }
</script>

/* ----------------------------------------------------------------

        /* ----------------------------------------------------------------

        const TIMEOUT_ARBITRO     = 30000; // ms
        const HEARTBEAT_INTERVAL  = 10000; // ms

        /* ----------------------------------------------------------------

        window.app = {

            // Dati
            partite:    [],
            squadre:    {},
            squalifiche: [],
            arbitriLista: [], // lista completa arbitri (per admin e assegnazioni)

            // =========================================================

            // =========================================================

          // =============================================================
        // PARTE 2 — LOGICA APPLICAZIONE
        // =============================================================

        // ----------------------------------------------------------------
        // HELPER LOGHI
        // ----------------------------------------------------------------

        logoSquadra(nomeSquadra) {
            const nomeFile = encodeURIComponent(nomeSquadra);
            return `${SUPABASE_URL}/storage/v1/object/public/loghi/${nomeFile}.png`;

        imgLogo(nomeSquadra, classi = 'w-8 h-8 object-contain rounded') {
            const url = this.logoSquadra(nomeSquadra);
            return `<img src="${url}" alt="${nomeSquadra}" class="${classi}" onerror="this.style.display='none'">`;
        },

       // ----------------------------------------------------------------
        // 2A — AUTENTICAZIONE
        // ----------------------------------------------------------------



        async init() {
            const arbitri      = await this.caricaArbitri();
            const emailSalvata = localStorage.getItem('arbitro_email');
            const utente       = arbitri.find(a => a.email === emailSalvata);

            if (utente) {
                this.utenteAutenticato = utente.email;
                this.emailUtente       = utente.email;
                this.ruoloUtente       = utente.ruolo || 'arbitro';
                this.arbitriLista      = arbitri;
                this.sottoscrivi();
                await this.caricaSqualifiche();
                await this.caricaSquadre();
                await this.caricaPartite();
                this.render();
            } else {
                this.renderLogin();
            }
        },

        async caricaArbitri() {
            try {
                const { data, error } = await supabase.from('arbitri').select('email, nome, ruolo, attivo').eq('attivo', true);
                if (error) throw error;
                return data || [];
            } catch (e) { console.error('Errore caricamento arbitri:', e); return []; }
        },

        async effettuaLogin(event) {
            event.preventDefault();
            const email  = document.getElementById('email-input').value.trim();
            const arbitri = await this.caricaArbitri();
            const utente  = arbitri.find(a => a.email === email);

            if (!utente) { alert('❌ Email non autorizzata. Contatta l\'amministratore.'); return; }

            this.utenteAutenticato = email;
            this.emailUtente       = email;
            this.ruoloUtente       = utente.ruolo || 'arbitro';
            this.arbitriLista      = arbitri;
            localStorage.setItem('arbitro_email', email);

            this.sottoscrivi();
            await this.caricaSqualifiche();
            await this.caricaSquadre();
            await this.caricaPartite();
            this.render();
        },

        logout() {
            if (!confirm('Vuoi effettuare il logout?')) return;
            localStorage.removeItem('arbitro_email');
            this.utenteAutenticato = null;
            this.emailUtente       = '';
            this.ruoloUtente       = 'arbitro';
            if (this.timerInterval)     clearInterval(this.timerInterval);
            if (this.heartbeatInterval) clearInterval(this.heartbeatInterval);
            this.renderLogin();
        },

        isOrganizzatore() { return this.ruoloUtente === 'organizzatore'; },

        /* ----------------------------------------------------------------
           2B — SQUADRE
           ---------------------------------------------------------------- */

        async caricaSquadre() {
            try {
                const { data, error } = await supabase.from('squadre').select('*');
                if (error) throw error;
                this.squadre = {};
                data.forEach(row => {
                    if (!this.squadre[row.nome_squadra]) this.squadre[row.nome_squadra] = [];
                    this.squadre[row.nome_squadra].push({ numero: row.numero, nome: row.nome_giocatore });
                });
            } catch (e) { console.error('Errore caricamento squadre:', e); }
        },

        async salvaSquadre() {
            try {
                await supabase.from('squadre').delete().neq('id', 0);
                const rows = [];
                Object.keys(this.squadre).forEach(sq => {
                    this.squadre[sq].forEach(g => rows.push({ nome_squadra: sq, numero: g.numero, nome_giocatore: g.nome }));
                });
                if (rows.length > 0) await supabase.from('squadre').insert(rows);
            } catch (e) { console.error('Errore salvataggio squadre:', e); }
        },

        aggiungiSquadraManuale() {
            if (!this.isOrganizzatore()) return;
            const nome = prompt('Nome della squadra:');
            if (!nome) return;
            const giocatori = [];
            let continua = true;
            while (continua) {
                const numero = prompt(`Squadra: ${nome}\nNumero maglia (lascia vuoto per terminare):`);
                if (!numero) break;
                const ng = prompt(`Squadra: ${nome}\nNome del giocatore n. ${numero}:`);
                if (!ng) break;
                giocatori.push({ numero: parseFloat(numero), nome: ng });
                continua = confirm('Aggiungere un altro giocatore?');
            }
            if (giocatori.length > 0) {
                this.squadre[nome] = giocatori;
                this.salvaSquadre();
                alert(`✓ Squadra "${nome}" aggiunta con ${giocatori.length} giocatori!`);
                this.render();
            }
        },

        importaSquadre() {
            if (!this.isOrganizzatore()) return;
            const url = prompt('Link Google Sheets (3 colonne: Squadra, Numero, Nome):');
            if (!url) return;
            let csvUrl = url;
            if (url.includes('/edit')) {
                const id = url.match(/\/d\/([a-zA-Z0-9-_]+)/)[1];
                csvUrl = `https://docs.google.com/spreadsheets/d/${id}/export?format=csv`;
            }
            fetch(csvUrl).then(r => r.text()).then(csv => {
                Papa.parse(csv, { header: true, skipEmptyLines: true, complete: (res) => {
                    res.data.forEach(row => {
                        const sq  = row.Squadra || row.squadra;
                        const numStr = (row.Numero ?? row.numero ?? '').toString().replace(',', '.');
                        const num = parseFloat(numStr);
                        const ng  = row.Nome || row.nome;
                        if (sq && !isNaN(num) && ng) {
                            if (!this.squadre[sq]) this.squadre[sq] = [];
                            if (!this.squadre[sq].some(g => g.numero === num && g.nome === ng))
                                this.squadre[sq].push({ numero: num, nome: ng });
                        }
                    });
                    this.salvaSquadre();
                    alert(`✓ Importate ${Object.keys(this.squadre).length} squadre!`);
                    this.render();
                }});
            }).catch(() => alert('✗ Errore import. Verifica che il link sia pubblico.'));
        },

        /* ----------------------------------------------------------------
           2C — PARTITE
           ---------------------------------------------------------------- */

        /** Mappa una riga DB in un oggetto partita locale */
        _mappaRigaPartita(row) {
            return {
                id:               row.id,
                campo:            row.campo            || 1,
                orario:           row.orario            || '',
                squadraA:         row.squadra_a,
                squadraB:         row.squadra_b,
                golA:             row.gol_a             || [],
                golB:             row.gol_b             || [],
                scalpiA:          row.scalpi_a          || [],
                scalpiB:          row.scalpi_b          || [],
                vuotiA:           row.vuoti_a           || [],
                vuotiB:           row.vuoti_b           || [],
                espulsiA:         row.espulsi_a         || [],
                espulsiB:         row.espulsi_b         || [],
                cartelliniA:      row.cartellini_a      || [],
                cartelliniB:      row.cartellini_b      || [],
                punteggioA:       row.punteggio_a       || 0,
                punteggioB:       row.punteggio_b       || 0,
                puntiA:           row.punti_a           || 0,
                puntiB:           row.punti_b           || 0,
                mvpA:             row.mvp_a             || '',
                mvpB:             row.mvp_b             || '',
                completata:       row.completata        || false,
                timerSecondi:     row.timer_secondi     || 0,
                timerTempo:       row.timer_tempo       || 1,
                timerAttivo:      row.timer_attivo      || false,
                timerTimestamp:   row.timer_timestamp   || 0,
                recupero1Tempo:   row.recupero_1tempo   || 0,
                recupero2Tempo:   row.recupero_2tempo   || 0,
                arbitroAttivo:    row.arbitro_attivo    || '',
                arbitroTimestamp: row.arbitro_timestamp || 0,
                arbitroAssegnato: row.arbitro_assegnato || '',
                falliDifesaA:     row.falli_difesa_a    || 0,
                falliDifesaB:     row.falli_difesa_b    || 0,
                falliDifesaTotA:  row.falli_difesa_tot_a || 0,
		falliDifesaTotB:  row.falli_difesa_tot_b || 0,
                vuotiSquadraA:    row.vuoti_squadra_a   || 0,
                vuotiSquadraB:    row.vuoti_squadra_b   || 0,
            };
        },

        async caricaPartite() {
            try {
                const { data, error } = await supabase.from('partite').select('*')
                    .order('orario', { ascending: true }).order('campo', { ascending: true });
                if (error) throw error;
                this.partite = data.map(r => this._mappaRigaPartita(r));
                this.connesso = true;
                this.sincronizzaTimer();
            } catch (e) { console.error('Errore caricamento partite:', e); this.connesso = false; }
        },

        sottoscrivi() {
            supabase.channel('db-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'partite' }, async (payload) => {
                    const nuovi  = payload.new || {};
                    const vecchi = payload.old || {};
                    const cambiati    = Object.keys(nuovi).filter(k => nuovi[k] !== vecchi[k]);
                    const soloHeartbeat = cambiati.every(k => k === 'arbitro_timestamp' || k === 'arbitro_attivo');
                    if (soloHeartbeat) return;

                    if (payload.eventType === 'UPDATE' && nuovi.id) {
                        const idx = this.partite.findIndex(x => x.id === nuovi.id);
                        if (idx !== -1) {
                            this.partite[idx] = this._mappaRigaPartita(nuovi);
                            this.sincronizzaTimer();
                            this.render();
                            return;
                        }
                    }
                    await this.caricaPartite();
                    this.render();
                }).subscribe();
        },

        async aggiungiPartita(campo, orario, squadraA, squadraB) {
            try {
                const { error } = await supabase.from('partite').insert([{
                    campo, orario, squadra_a: squadraA, squadra_b: squadraB,
                    gol_a: [], gol_b: [], scalpi_a: [], scalpi_b: [],
                    vuoti_a: [], vuoti_b: [], espulsi_a: [], espulsi_b: [],
                    cartellini_a: [], cartellini_b: [],
                    punteggio_a: 0, punteggio_b: 0, punti_a: 0, punti_b: 0,
                    mvp_a: '', mvp_b: '', completata: false,
                    timer_secondi: 0, timer_tempo: 1, timer_attivo: false, timer_timestamp: 0,
                    recupero_1tempo: 0, recupero_2tempo: 0,
                    arbitro_attivo: '', arbitro_timestamp: 0, arbitro_assegnato: '',
                    falli_difesa_a: 0, falli_difesa_b: 0, vuoti_squadra_a: 0, vuoti_squadra_b: 0,
                }]);
                if (error) throw error;
            } catch (e) { alert('Errore aggiunta partita: ' + e.message); }
        },

        async aggiornaPartita(id, updates) {
            try {
                const p = this.partite.find(x => x.id === id);
                const u = { ...p, ...updates };
                const db = {
                    squadra_a: u.squadraA, squadra_b: u.squadraB,
                    gol_a: u.golA, gol_b: u.golB,
                    scalpi_a: u.scalpiA, scalpi_b: u.scalpiB,
                    vuoti_a: u.vuotiA, vuoti_b: u.vuotiB,
                    espulsi_a: u.espulsiA, espulsi_b: u.espulsiB,
                    cartellini_a: u.cartelliniA, cartellini_b: u.cartelliniB,
                    punteggio_a: u.punteggioA, punteggio_b: u.punteggioB,
                    punti_a: u.puntiA, punti_b: u.puntiB,
                    mvp_a: u.mvpA, mvp_b: u.mvpB, completata: u.completata,
                };
                if ('timerSecondi'    in updates) db.timer_secondi     = u.timerSecondi;
                if ('timerTempo'      in updates) db.timer_tempo       = u.timerTempo;
                if ('timerAttivo'     in updates) db.timer_attivo      = u.timerAttivo;
                if ('timerTimestamp'  in updates) db.timer_timestamp   = u.timerTimestamp;
                if ('recupero1Tempo'  in updates) db.recupero_1tempo   = u.recupero1Tempo;
                if ('recupero2Tempo'  in updates) db.recupero_2tempo   = u.recupero2Tempo;
                if ('falliDifesaA'    in updates) db.falli_difesa_a    = u.falliDifesaA;
                if ('falliDifesaB'    in updates) db.falli_difesa_b    = u.falliDifesaB;
                if ('vuotiSquadraA'   in updates) db.vuoti_squadra_a   = u.vuotiSquadraA;
                if ('vuotiSquadraB'   in updates) db.vuoti_squadra_b   = u.vuotiSquadraB;
                if ('arbitroAssegnato' in updates) db.arbitro_assegnato = u.arbitroAssegnato;
		if ('falliDifesaTotA' in updates) db.falli_difesa_tot_a = u.falliDifesaTotA;
		if ('falliDifesaTotB' in updates) db.falli_difesa_tot_b = u.falliDifesaTotB;

                const { error } = await supabase.from('partite').update(db).eq('id', id);
                if (error) throw error;
                const idx = this.partite.findIndex(x => x.id === id);
                if (idx !== -1) this.partite[idx] = u;
                this.render();
            } catch (e) { console.error('Errore aggiornamento partita:', e); }
        },

        async salvaPartitaAsync(id, updates) {
            try {
                const p = this.partite.find(x => x.id === id);
                const u = { ...p, ...updates };
                await supabase.from('partite').update({
                    gol_a: u.golA, gol_b: u.golB,
                    scalpi_a: u.scalpiA, scalpi_b: u.scalpiB,
                    vuoti_a: u.vuotiA, vuoti_b: u.vuotiB,
                    espulsi_a: u.espulsiA, espulsi_b: u.espulsiB,
                    cartellini_a: u.cartelliniA, cartellini_b: u.cartelliniB,
                    punteggio_a: u.punteggioA, punteggio_b: u.punteggioB,
                    punti_a: u.puntiA, punti_b: u.puntiB,
                    mvp_a: u.mvpA, mvp_b: u.mvpB, completata: u.completata,
                    vuoti_squadra_a: u.vuotiSquadraA, vuoti_squadra_b: u.vuotiSquadraB,
                    falli_difesa_a: u.falliDifesaA, falli_difesa_b: u.falliDifesaB,
		falli_difesa_tot_a: u.falliDifesaTotA, falli_difesa_tot_b: u.falliDifesaTotB,
                }).eq('id', id);
            } catch (e) { console.error('Errore salvataggio asincrono:', e); }
        },

        async eliminaPartita(id) {
            if (!confirm('Eliminare questa partita? L\'operazione è irreversibile.')) return;
            try {
                const { error } = await supabase.from('partite').delete().eq('id', id);
                if (error) throw error;
            } catch (e) { console.error('Errore eliminazione partita:', e); }
        },

        importaPartite() {
            if (!this.isOrganizzatore()) return;
            const url = prompt('Link Google Sheets partite (colonne: Campo, Orario, SquadraA, SquadraB):');
            if (!url) return;
            let csvUrl = url;
            if (url.includes('/edit')) {
                const id = url.match(/\/d\/([a-zA-Z0-9-_]+)/)[1];
                csvUrl = `https://docs.google.com/spreadsheets/d/${id}/export?format=csv`;
            }
            fetch(csvUrl).then(r => r.text()).then(csv => {
                Papa.parse(csv, { header: true, skipEmptyLines: true, complete: async (res) => {
                    let n = 0;
                    for (const row of res.data) {
                        const campo    = parseInt(row.Campo || row.campo || '1');
                        const orario   = row.Orario || row.orario || '';
                        const squadraA = (row.SquadraA || row['Squadra A'] || '').trim();
                        const squadraB = (row.SquadraB || row['Squadra B'] || '').trim();
                        if (!squadraA || !squadraB) continue;
                        await this.aggiungiPartita(campo, orario, squadraA, squadraB);
                        n++;
                        await new Promise(r => setTimeout(r, 100));
                    }
                    alert(`✓ Importate ${n} partite!`);
                }});
            }).catch(() => alert('✗ Errore import partite.'));
        },

        /* ----------------------------------------------------------------
           2D — CONTROLLO ESCLUSIVO + ASSEGNAZIONE
           ---------------------------------------------------------------- */

        /** Verifica se l'utente corrente può accedere alla partita */
        _puoAccedere(p) {
            if (this.isOrganizzatore()) return true;
            if (!p.arbitroAssegnato) return true; // nessuno assegnato = tutti possono
            return p.arbitroAssegnato === this.emailUtente;
        },

        async prelevaControlloPartita(id) {
            const p = this.partite.find(x => x.id === id);
            if (!p) return false;

            if (!this._puoAccedere(p)) {
                alert(`🔒 Questa partita è assegnata a ${p.arbitroAssegnato}.\n\nSolo quell'arbitro o un organizzatore può gestirla.`);
                return false;
            }

            const ora = Date.now();
            if (p.arbitroAttivo && p.arbitroAttivo !== this.emailUtente && (ora - p.arbitroTimestamp) < TIMEOUT_ARBITRO) {
                const s = Math.ceil((TIMEOUT_ARBITRO - (ora - p.arbitroTimestamp)) / 1000);
                alert(`⚠️ ${p.arbitroAttivo} sta gestendo questa partita.\n\nRiprova tra ${s} secondi.`);
                return false;
            }

            try {
                await supabase.from('partite').update({ arbitro_attivo: this.emailUtente, arbitro_timestamp: ora }).eq('id', id);
                if (this.heartbeatInterval) clearInterval(this.heartbeatInterval);
                this.heartbeatInterval = setInterval(() => this.inviaHeartbeat(id), HEARTBEAT_INTERVAL);
                return true;
            } catch (e) { console.error('Errore acquisizione controllo:', e); return false; }
        },

        async inviaHeartbeat(id) {
            if (!this.partitaSelezionata || this.partitaSelezionata !== id) {
                clearInterval(this.heartbeatInterval); this.heartbeatInterval = null; return;
            }
            try { await supabase.from('partite').update({ arbitro_timestamp: Date.now() }).eq('id', id); }
            catch (e) { console.error('Errore heartbeat:', e); }
        },

        async rilasciaControlloPartita(id) {
            if (this.heartbeatInterval) { clearInterval(this.heartbeatInterval); this.heartbeatInterval = null; }
            try { await supabase.from('partite').update({ arbitro_attivo: '', arbitro_timestamp: 0 }).eq('id', id); }
            catch (e) { console.error('Errore rilascio controllo:', e); }
        },

        async apriPartita(id) {
            const controllo = await this.prelevaControlloPartita(id);
            if (!controllo) return;
            this.partitaSelezionata = id;
            this.sincronizzaTimer();
            this.render();
        },

        /** Assegna una partita a un arbitro specifico (solo organizzatori) */
        async assegnaArbitro(partitaId, emailArbitro) {
            try {
                const { error } = await supabase.from('partite')
                    .update({ arbitro_assegnato: emailArbitro }).eq('id', partitaId);
                if (error) throw error;
                const idx = this.partite.findIndex(x => x.id === partitaId);
                if (idx !== -1) this.partite[idx].arbitroAssegnato = emailArbitro;
                this.render();
            } catch (e) { alert('Errore assegnazione arbitro: ' + e.message); }
        },

        /* ----------------------------------------------------------------
           2E — TIMER
           ---------------------------------------------------------------- */

        async avviaTimer(id) {
            const p = this.partite.find(x => x.id === id);
            if (!p) return;
            const controllo = await this.prelevaControlloPartita(id);
            if (!controllo) return;
            this.partitaSelezionata        = id;
            this.avvisoMinutoSuonato       = false;
            this.fischioPrimoTempoSuonato  = false;
            this.fischioSecondoTempoSuonato = false;
            await this.aggiornaPartita(id, { timerAttivo: true, timerTimestamp: Date.now() });
            this.sincronizzaTimer();
        },

        async pausaTimer(id) {
            const p = this.partite.find(x => x.id === id);
            if (!p) return;
            const elapsed = Math.floor((Date.now() - p.timerTimestamp) / 1000);
            await this.aggiornaPartita(id, { timerSecondi: p.timerSecondi + elapsed, timerAttivo: false, timerTimestamp: Date.now() });
            if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
        },

        async fermaTimer(id) {
            await this.aggiornaPartita(id, { timerSecondi: 0, timerTempo: 1, timerAttivo: false, timerTimestamp: 0 });
            if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
        },

        async aggiungiRecupero(id, minuti) {
            const p = this.partite.find(x => x.id === id);
            if (!p) return;
            const campo       = p.timerTempo === 1 ? 'recupero1Tempo' : 'recupero2Tempo';
            const nuovoRecupero = (p[campo] || 0) + minuti;
            if (nuovoRecupero > MAX_RECUPERO_MINUTI) { alert(`⚠️ Recupero massimo: ${MAX_RECUPERO_MINUTI} minuti per tempo`); return; }
            await this.aggiornaPartita(id, { [campo]: nuovoRecupero });
            alert(`✓ Aggiunti ${minuti}' di recupero (Tot: ${nuovoRecupero}')`);
        },

        sincronizzaTimer() {
            if (this.timerInterval) clearInterval(this.timerInterval);
            if (!this.partitaSelezionata) return;
            const p = this.partite.find(x => x.id === this.partitaSelezionata);
            if (!p || !p.timerAttivo) return;
            if (p.timerSecondi < 5) {
                this.avvisoMinutoSuonato = this.fischioPrimoTempoSuonato = this.fischioSecondoTempoSuonato = false;
            }
            const elapsed = Math.floor((Date.now() - p.timerTimestamp) / 1000);
            this.aggiornaTimerDisplay(p.timerSecondi + elapsed, p.timerTempo);
            this.timerInterval = setInterval(() => this.aggiornaTimerLocale(), 1000);
        },

        aggiornaTimerLocale() {
            if (!this.partitaSelezionata) return;
            const p = this.partite.find(x => x.id === this.partitaSelezionata);
            if (!p || !p.timerAttivo) return;
            const elapsed         = Math.floor((Date.now() - p.timerTimestamp) / 1000);
            const secondiCorretti = p.timerSecondi + elapsed;
            const durataBase      = p.timerTempo >= 3 ? DURATA_TEMPO_EXTRA : DURATA_TEMPO_STD;
            const recupero        = p.timerTempo === 1 ? p.recupero1Tempo : p.recupero2Tempo;
            const tempoTotale     = durataBase + (recupero * 60);
            const rimasti         = tempoTotale - secondiCorretti;

            if (rimasti <= 60 && rimasti > 59 && !this.avvisoMinutoSuonato) { this.avvisoMinutoSuonato = true; creaAvvisoMinuto(); }
            if (rimasti > 0 && rimasti <= 15) creaBeep();
            if (p.timerTempo === 1 && secondiCorretti >= tempoTotale && !this.fischioPrimoTempoSuonato) { this.fischioPrimoTempoSuonato = true; creaFischio(); }
            if (p.timerTempo >= 2 && secondiCorretti >= tempoTotale && !this.fischioSecondoTempoSuonato) { this.fischioSecondoTempoSuonato = true; creaFischio(); }

            this.aggiornaTimerDisplay(secondiCorretti, p.timerTempo);
        },

        aggiornaTimerDisplay(secondi, tempo) {
            const timerEl = document.getElementById('timer-display');
            if (timerEl) timerEl.textContent = this.formatoTempo(secondi);
            const tempoEl = document.getElementById('tempo-display');
            if (tempoEl) tempoEl.textContent =
                tempo === 1 ? 'Tempo 1/2' : tempo === 2 ? 'Tempo 2/2' :
                tempo === 3 ? '⚡ Silver Meta' : '🥇 Golden Meta';

            const p = this.partite.find(x => x.id === this.partitaSelezionata);
            if (!p) return;
            const recupero   = tempo === 1 ? p.recupero1Tempo : p.recupero2Tempo;
            const durataBase = tempo >= 3 ? DURATA_TEMPO_EXTRA : DURATA_TEMPO_STD;
            const tempoTotale = durataBase + (recupero * 60);
            const pct = Math.min((secondi / tempoTotale) * 100, 100);

            const bar = document.getElementById('progress-bar');
            if (bar) {
                bar.style.width = `${pct}%`;
                bar.className = `progress-bar h-full rounded-full ${pct > 90 ? 'bg-red-500' : pct > 75 ? 'bg-orange-500' : 'bg-cyan-500'}`;
            }
            const recEl = document.getElementById('recupero-display');
            if (recEl) {
                if (secondi > DURATA_TEMPO_STD) { recEl.textContent = `+${Math.floor((secondi - DURATA_TEMPO_STD) / 60) + 1}'`; recEl.classList.remove('hidden'); }
                else recEl.classList.add('hidden');
            }
        },

        formatoTempo(secondi) {
            return `${String(Math.floor(secondi / 60)).padStart(2,'0')}:${String(secondi % 60).padStart(2,'0')}`;
        },

        /* ----------------------------------------------------------------
           2F — CAMBIO TEMPO
           ---------------------------------------------------------------- */

        async passaAlSecondoTempoManuale(id) {
            if (!confirm('⏭ Passare al 2° tempo?\n\nI vuoti individuali verranno azzerati e gli espulsi per vuoti rientreranno.\nI giocatori con cartellino giallo del 1° tempo potranno rientrare.')) return;
            if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
            this.avvisoMinutoSuonato = this.fischioPrimoTempoSuonato = this.fischioSecondoTempoSuonato = false;
            const p = this.partite.find(x => x.id === id);
            await this.aggiornaPartita(id, {
                timerSecondi: 0, timerTempo: 2, timerAttivo: false, timerTimestamp: 0,
                vuotiA: [], vuotiB: [], espulsiA: [], espulsiB: [],
                cartelliniA: p.cartelliniA.filter(c => !(c.tipo === 'giallo' && c.tempo === 1)),
                cartelliniB: p.cartelliniB.filter(c => !(c.tipo === 'giallo' && c.tempo === 1)),
            });
        },

        async passaAllaSilverMeta(id) {
            const p = this.partite.find(x => x.id === id);
            if (!p || p.punteggioA !== p.punteggioB) { alert('⚠️ La Silver Meta si gioca solo in caso di parità!'); return; }
            if (!confirm('⚡ SILVER META (5 min)\n\n✅ Rientrano: espulsi per vuoti, cartellini gialli\n❌ Rimangono fuori: cartellini rossi e neri\n✅ Vuoti individuali azzerati (limite: 2)')) return;
            if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
            this.avvisoMinutoSuonato = this.fischioPrimoTempoSuonato = this.fischioSecondoTempoSuonato = false;
            await this.aggiornaPartita(id, {
                timerSecondi: 0, timerTempo: 3, timerAttivo: false, timerTimestamp: 0,
                vuotiA: [], vuotiB: [],
                espulsiA: (p.cartelliniA||[]).filter(c=>c.tipo==='rosso'||c.tipo==='nero').map(c=>c.giocatore),
                espulsiB: (p.cartelliniB||[]).filter(c=>c.tipo==='rosso'||c.tipo==='nero').map(c=>c.giocatore),
                cartelliniA: (p.cartelliniA||[]).filter(c=>c.tipo!=='giallo'),
                cartelliniB: (p.cartelliniB||[]).filter(c=>c.tipo!=='giallo'),
            });
        },

        async passaAllaGoldenMeta(id) {
            const p = this.partite.find(x => x.id === id);
            if (!p || p.punteggioA !== p.punteggioB) { alert('⚠️ La Golden Meta si gioca solo in caso di parità!'); return; }
            if (!confirm('🥇 GOLDEN META (5 min)\n\n❌ Espulsi nella Silver Meta rimangono fuori\n✅ Vuoti individuali mantenuti dalla Silver Meta (limite: 2)')) return;
            if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
            this.avvisoMinutoSuonato = this.fischioPrimoTempoSuonato = this.fischioSecondoTempoSuonato = false;
            await this.aggiornaPartita(id, { timerSecondi: 0, timerTempo: 4, timerAttivo: false, timerTimestamp: 0 });
        },

        /* ----------------------------------------------------------------
           2G — EVENTI DI GIOCO
           ---------------------------------------------------------------- */

        /** Crea un oggetto evento con giocatore, minuto corrente e tempo */
        _creaEvento(giocatore, p) {
            const elapsed  = p.timerAttivo ? Math.floor((Date.now() - p.timerTimestamp) / 1000) : 0;
            const secondi  = p.timerSecondi + elapsed;
            const minuto   = this.formatoTempo(secondi);
            return { giocatore, minuto, tempo: p.timerTempo };
        },

        /** Estrae il nome giocatore da un evento (stringa o oggetto) */
        _nomeGiocatore(ev) { return typeof ev === 'string' ? ev : (ev?.giocatore ?? ''); },

        aggiungiElemento(id, squadra, tipo) {
            const p      = this.partite.find(x => x.id === id);
            const inputId = `${tipo === 'scalpo' ? 'scalpo' : tipo}-${squadra}-${id}`;
            const input  = document.getElementById(inputId);
            const val    = input.tagName === 'SELECT' ? input.value : input.value.trim();
            if (!val) return;

            const key = tipo === 'gol' ? `gol${squadra}` : tipo === 'scalpo' ? `scalpi${squadra}` : null;
            if (!key) return;

            const evento  = this._creaEvento(val, p);
            const nuovi   = [...p[key], evento];
            const updates = { [key]: nuovi };
            if (tipo === 'gol') updates[`punteggio${squadra}`] = nuovi.length;

            const idx = this.partite.findIndex(x => x.id === id);
            if (idx !== -1) this.partite[idx] = { ...p, ...updates };
            this.salvaPartitaAsync(id, updates);
            input.value = '';
            this.render();
        },

        rimuoviElemento(id, squadra, tipo, index) {
            const p   = this.partite.find(x => x.id === id);
            const key = tipo === 'gol' ? `gol${squadra}` : tipo === 'scalpo' ? `scalpi${squadra}` : tipo === 'vuoto' ? `vuoti${squadra}` : null;
            if (!key) return;
            const nuovi   = [...p[key]]; nuovi.splice(index, 1);
            const updates = { [key]: nuovi };
            if (tipo === 'gol')   updates[`punteggio${squadra}`]  = nuovi.length;
            if (tipo === 'vuoto') updates[`vuotiSquadra${squadra}`] = Math.max(0, p[`vuotiSquadra${squadra}`] - 1);
            const idx = this.partite.findIndex(x => x.id === id);
            if (idx !== -1) this.partite[idx] = { ...p, ...updates };
            this.salvaPartitaAsync(id, updates);
            this.render();
        },

        aggiungiVuotoBtn(id, squadra) {
            const input = document.getElementById(`vuoto-${squadra}-${id}`);
            const val   = input.tagName === 'SELECT' ? input.value : input.value.trim();
            if (!val) return;
            const p = this.partite.find(x => x.id === id);
            if (p[`espulsi${squadra}`].includes(val)) { alert('🟥 Giocatore già espulso!'); return; }
            this.aggiungiVuoto(id, squadra, val);
            input.value = '';
        },

        async aggiungiVuoto(id, squadra, giocatore) {
            const p       = this.partite.find(x => x.id === id);
            const evento  = this._creaEvento(giocatore, p);
            const vuoti   = [...p[`vuoti${squadra}`], evento];
            const conteggio = vuoti.filter(v => this._nomeGiocatore(v) === giocatore).length;
            const nuoviVuotiSquadra = p[`vuotiSquadra${squadra}`] + 1;

            let updates = { [`vuoti${squadra}`]: vuoti, [`vuotiSquadra${squadra}`]: nuoviVuotiSquadra };

            const limite = p.timerTempo >= 3 ? LIMITE_VUOTI_EXTRA : LIMITE_VUOTI_STD;
            if (conteggio >= limite) {
                updates[`espulsi${squadra}`] = [...p[`espulsi${squadra}`], giocatore];
                alert(`🟥 ESPULSIONE!\n${giocatore} ha ${limite} vuoti ed è stato espulso.`);
            }

            let messaggioFallo = '';
            if (nuoviVuotiSquadra === SOGLIA_FALLO_VUOTI ||
               (nuoviVuotiSquadra > SOGLIA_FALLO_VUOTI && (nuoviVuotiSquadra - SOGLIA_FALLO_VUOTI) % 3 === 0)) {
                const nuoviFalli = p[`falliDifesa${squadra}`] + 1;
updates[`falliDifesaTot${squadra}`] = (p[`falliDifesaTot${squadra}`] || 0) + 1;   // NUOVA
                if (nuoviFalli === FALLI_PER_META) {
                    const opp = squadra === 'A' ? 'B' : 'A';
                    const metaEv = { giocatore: 'META (3° Fallo difesa)', minuto: this.formatoTempo(p.timerSecondi + (p.timerAttivo ? Math.floor((Date.now()-p.timerTimestamp)/1000) : 0)), tempo: p.timerTempo };
                   
                    const golOpposti = [...p[`gol${opp}`], metaEv];
                    updates[`falliDifesa${squadra}`] = 0;
                    updates[`gol${opp}`]   = golOpposti;
                    updates[`punteggio${opp}`] = golOpposti.length;
                    messaggioFallo = `\n\n⚠️ ${nuoviVuotiSquadra}° VUOTO DI SQUADRA!\n3° FALLO DI DIFESA!\nMETA assegnata a ${p[`squadra${opp}`]}`;
                } else {
                    updates[`falliDifesa${squadra}`] = nuoviFalli;
                    messaggioFallo = `\n\n⚠️ ${nuoviVuotiSquadra}° VUOTO DI SQUADRA!\nFallo di difesa assegnato (${nuoviFalli}/3).`;
                }
            }

            const idx = this.partite.findIndex(x => x.id === id);
            if (idx !== -1) this.partite[idx] = { ...p, ...updates };
            await this.salvaPartitaAsync(id, updates);
            if (messaggioFallo) alert(messaggioFallo);
            this.render();
        },

        azzeraVuoti(id, squadra) {
            const p = this.partite.find(x => x.id === id);
            if (!confirm(`⚠️ Azzerare SOLO i vuoti individuali?\n• Vuoti individuali: AZZERATI\n• Vuoti di squadra: RIMANGONO (${p[`vuotiSquadra${squadra}`]})\n• Espulsi per vuoti: RIENTRANO`)) return;
            const updates = { [`vuoti${squadra}`]: [], [`espulsi${squadra}`]: [] };
            const idx = this.partite.findIndex(x => x.id === id);
            if (idx !== -1) this.partite[idx] = { ...p, ...updates };
            this.salvaPartitaAsync(id, updates);
            this.render();
        },

        rientraEspulso(id, squadra, giocatore) {
            if (!confirm(`Far rientrare ${giocatore}?`)) return;
            const p      = this.partite.find(x => x.id === id);
            const espulsi = p[`espulsi${squadra}`].filter(e => e !== giocatore);
            const updates = { [`espulsi${squadra}`]: espulsi };
            const idx = this.partite.findIndex(x => x.id === id);
            if (idx !== -1) this.partite[idx] = { ...p, ...updates };
            this.salvaPartitaAsync(id, updates);
            this.render();
        },

         async aggiungiFalloDifesa(id, squadra) {
            const p = this.partite.find(x => x.id === id);
            if (!p) return;
            const opp        = squadra === 'A' ? 'B' : 'A';
            const nuoviFalli = p[`falliDifesa${squadra}`] + 1;
            const nuovoTot   = (p[`falliDifesaTot${squadra}`] || 0) + 1;
            if (nuoviFalli === FALLI_PER_META) {
                const metaEv = { giocatore: 'META (3° Fallo difesa)', minuto: this.formatoTempo(p.timerSecondi + (p.timerAttivo ? Math.floor((Date.now()-p.timerTimestamp)/1000) : 0)), tempo: p.timerTempo };
                const golOpposti = [...p[`gol${opp}`], metaEv];
                await this.aggiornaPartita(id, {
                    [`falliDifesa${squadra}`]: 0,
                    [`falliDifesaTot${squadra}`]: nuovoTot,
                    [`gol${opp}`]: golOpposti,
                    [`punteggio${opp}`]: golOpposti.length
                });
                alert(`⚠️ 3° FALLO DI DIFESA!\nMETA assegnata a ${p[`squadra${opp}`]}`);
            } else {
                await this.aggiornaPartita(id, { [`falliDifesa${squadra}`]: nuoviFalli, [`falliDifesaTot${squadra}`]: nuovoTot });
                alert(`✓ Fallo di difesa registrato (${nuoviFalli}/3)`);
            }
        },   
        
        async aggiungiCartellino(id, squadra, giocatore, tipo) {
            const p = this.partite.find(x => x.id === id);
            if (!p) return;
            const evento = { giocatore, tipo, tempo: p.timerTempo, minuto: this.formatoTempo(p.timerSecondi + (p.timerAttivo ? Math.floor((Date.now()-p.timerTimestamp)/1000) : 0)) };
            const nuoviCartellini = [...p[`cartellini${squadra}`], evento];
            const updates = { [`cartellini${squadra}`]: nuoviCartellini };

            if (tipo === 'nero') {
                try {
                    await supabase.from('squalifiche').insert([{ nome_giocatore: giocatore, nome_squadra: p[`squadra${squadra}`], partita_id: id }]);
                    await this.caricaSqualifiche();
                } catch (e) { console.error('Errore registrazione squalifica:', e); }
                alert(`⬛ SQUALIFICA!\n${giocatore} è squalificato per tutto il torneo.`);
            } else if (tipo === 'rosso') {
                alert(`🟥 CARTELLINO ROSSO!\n${giocatore} è escluso per tutta la partita.`);
            } else {
                alert(`🟨 CARTELLINO GIALLO!\n${giocatore} è escluso per questo tempo.`);
            }

            const idx = this.partite.findIndex(x => x.id === id);
            if (idx !== -1) this.partite[idx] = { ...p, ...updates };
            await this.salvaPartitaAsync(id, updates);
            this.render();
        },

        async rimuoviCartellino(id, squadra, index) {
            const p = this.partite.find(x => x.id === id);
            if (!p) return;
            const nuoviCartellini = [...p[`cartellini${squadra}`]]; nuoviCartellini.splice(index, 1);
            const updates = { [`cartellini${squadra}`]: nuoviCartellini };
            const idx = this.partite.findIndex(x => x.id === id);
            if (idx !== -1) this.partite[idx] = { ...p, ...updates };
            await this.salvaPartitaAsync(id, updates);
            this.render();
        },

        /* ----------------------------------------------------------------
           2H — SQUALIFICHE
           ---------------------------------------------------------------- */

        async caricaSqualifiche() {
            try {
                const { data, error } = await supabase.from('squalifiche').select('nome_giocatore, nome_squadra');
                if (error) throw error;
                this.squalifiche = data || [];
            } catch (e) { console.error('Errore caricamento squalifiche:', e); this.squalifiche = []; }
        },

        _statoGiocatore(gNome, squadra, nome, p) {
            if (this.squalifiche.some(s => s.nome_giocatore === gNome && s.nome_squadra === nome))
                return { disabilitato: true, motivo: '⬛ SQUAL' };
            if (p[`cartellini${squadra}`].some(c => c.giocatore === gNome && c.tipo === 'rosso'))
                return { disabilitato: true, motivo: '🟥 ESP' };
            if (p[`cartellini${squadra}`].some(c => c.giocatore === gNome && c.tipo === 'giallo' && c.tempo === p.timerTempo))
                return { disabilitato: true, motivo: '🟨 ESP' };
            if (p[`espulsi${squadra}`].includes(gNome))
                return { disabilitato: true, motivo: '[ESP]' };
            return { disabilitato: false, motivo: '' };
        },

        /* ----------------------------------------------------------------
           2I — FINALIZZAZIONE
           ---------------------------------------------------------------- */

        async confermaSalvaPartita(id) {
            const p    = this.partite.find(x => x.id === id);
            const mvpA = document.getElementById('mvp-select-a').value;
            const mvpB = document.getElementById('mvp-select-b').value;

            if (p.timerTempo === 1 && (p.timerAttivo || p.timerSecondi > 0)) {
                alert('⚠️ Il 2° tempo non è ancora iniziato.\n\nPassa al 2° tempo prima di finalizzare la partita.'); return;
            }
            if ([2,3,4].includes(p.timerTempo) && p.timerAttivo) {
                const nomeT = p.timerTempo === 2 ? '2° tempo' : p.timerTempo === 3 ? 'Silver Meta' : 'Golden Meta';
                if (!confirm(`⚠️ La ${nomeT} è ancora in corso!\n\nVuoi finalizzare comunque?`)) return;
            }
            if (p.timerTempo === 2 && p.punteggioA === p.punteggioB) {
                if (!confirm('⚠️ La partita è in parità!\n\nVuoi finalizzare senza Silver Meta?')) return;
            }
            if (!mvpA || !mvpB) {
                const mancanti = [...(!mvpA ? [p.squadraA] : []), ...(!mvpB ? [p.squadraB] : [])];
                if (!confirm(`⚠️ MVP non selezionati per:\n${mancanti.join('\n')}\n\nVuoi finalizzare comunque?`)) return;
            }

            const scoreA = p.golA.length, scoreB = p.golB.length;
            let puntiA = 0, puntiB = 0;
            if (scoreA > scoreB) puntiA = 3; else if (scoreB > scoreA) puntiB = 3; else { puntiA = 1; puntiB = 1; }

            await this.fermaTimer(id);
            await this.rilasciaControlloPartita(id);
            await this.aggiornaPartita(id, { punteggioA: scoreA, punteggioB: scoreB, puntiA, puntiB, mvpA, mvpB, completata: true });
            this.partitaSelezionata = null;
        },

        /* ----------------------------------------------------------------
           2J — CLASSIFICHE E STATISTICHE
           ---------------------------------------------------------------- */

        calcolaClassifica() {
            const cls = {};
            this.partite.filter(p => p.completata).forEach(p => {
                [[p.squadraA, p.puntiA, p.punteggioA, p.punteggioB],
                 [p.squadraB, p.puntiB, p.punteggioB, p.punteggioA]].forEach(([sq, pt, gf, gs]) => {
                    if (!cls[sq]) cls[sq] = { nome: sq, punti: 0, giocate: 0, vinte: 0, pareggiate: 0, perse: 0, gf: 0, gs: 0 };
                    cls[sq].punti += pt; cls[sq].giocate++; cls[sq].gf += gf; cls[sq].gs += gs;
                    if (gf > gs) cls[sq].vinte++; else if (gf === gs) cls[sq].pareggiate++; else cls[sq].perse++;
                });
            });
            return Object.values(cls).sort((a, b) => {
                if (b.punti !== a.punti) return b.punti - a.punti;
                const da = a.gf - a.gs, db = b.gf - b.gs;
                return db !== da ? db - da : b.gf - a.gf;
            });
        },

calcolaStatistiche() {
    const m = {}, s = {}, mvps = {};
    const vuotiSq = {}, falliSq = {}, partiteSq = {};

    this.partite.forEach(p => {
        ['A','B'].forEach(sq => {
            const nome = p[`squadra${sq}`];

            // Statistiche giocatori (invariate)
            p[`gol${sq}`].forEach(ev => {
                const g = this._nomeGiocatore(ev);
                if (!g.includes('META') && !g.includes("META'")) { const k = `${g}||${nome}`; m[k] = (m[k]||0)+1; }
            });
            p[`scalpi${sq}`].forEach(ev => { const g = this._nomeGiocatore(ev); const k = `${g}||${nome}`; s[k] = (s[k]||0)+1; });
            if (p[`mvp${sq}`]) { const k = `${p[`mvp${sq}`]}||${nome}`; mvps[k] = (mvps[k]||0)+1; }

            // Statistiche di squadra (solo partite completate)
            if (p.completata) {
                partiteSq[nome] = (partiteSq[nome]||0) + 1;
                vuotiSq[nome]   = (vuotiSq[nome]||0)   + (p[`vuotiSquadra${sq}`]   || 0);
                falliSq[nome]   = (falliSq[nome]||0)   + (p[`falliDifesaTot${sq}`] || 0);
            }
        });
    });

    const parse = (obj, campo) => Object.entries(obj).map(([k, n]) => { const [nome, sq] = k.split('||'); return { nome, squadra: sq, [campo]: n }; }).sort((a,b) => b[campo]-a[campo]);

    const perSquadra = (obj) => Object.entries(obj)
        .filter(([, n]) => n > 0)
        .map(([nome, n]) => ({ nome, valore: n, partite: partiteSq[nome] || 0 }))
        .sort((a,b) => b.valore - a.valore || a.partite - b.partite);

    return {
        marcatori:     parse(m,'gol'),
        scalpatori:    parse(s,'scalpi'),
        mvps:          parse(mvps,'volte'),
        vuotiSquadre:  perSquadra(vuotiSq),
        falliSquadre:  perSquadra(falliSq),
    };
},

      /* ----------------------------------------------------------------
           2L — PDF REFERTO DETTAGLIATO
           ---------------------------------------------------------------- */


async generaPDF(id, soloBlob = false) {

    const p = this.partite.find(x => x.id === id);

    if (!p) return;

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();



    // ── Helper: aggiunge pagina se necessario e restituisce la y corrente ──

    const check = (y, spazio = 10) => {

        if (y + spazio > 270) {

            doc.addPage();

            doc.setFontSize(8); doc.setTextColor(150,150,150);

            doc.text(`${p.squadraA} vs ${p.squadraB} - continua`, 105, 10, { align: 'center' });

            doc.setTextColor(0,0,0);

            return 20;

        }

        return y;

    };



    // ── Helper: riga di testo con y automatica ──

    const riga = (testo, x, y, opzioni = {}) => {

        doc.text(testo, x, y, opzioni);

        return y + (opzioni.interlinea || 7);

    };



    let y = 15;



    // ── 1. TITOLO ──

    doc.setFontSize(18); doc.setTextColor(14,116,144);

    y = riga('24OdG - REFERTO PARTITA', 105, y, { align: 'center' });

    y += 3;



    // ── 2. INFO PARTITA ──

    doc.setFontSize(10); doc.setTextColor(80,80,80);

    y = riga(`Campo: ${p.campo}  •  Orario: ${p.orario}  •  Data: ${new Date().toLocaleDateString('it-IT')}`, 20, y);

    if (p.arbitroAssegnato) y = riga(`Arbitro: ${p.arbitroAssegnato}`, 20, y);

    if (p.timerTempo >= 3) {

        doc.setTextColor(180,130,0);

        y = riga(`Supplementari: ${p.timerTempo === 3 ? 'Silver Meta' : 'Golden Meta'}`, 20, y);

        doc.setTextColor(80,80,80);

    }

 

    y += 2;



    // ── 3. LINEA ──

    doc.setDrawColor(14,116,144); doc.line(20, y, 190, y); y += 8;



    // ── 4. LOGHI + NOMI SQUADRE + RISULTATO ──

    const yBloccoRisultato = y;



    // Loghi (caricati in parallelo)

    const caricaLogo = async (nome, x, yPos) => {

        try {

            const url  = this.logoSquadra(nome);

            const resp = await fetch(url);

            if (!resp.ok) return;

            const blob   = await resp.blob();

            const reader = new FileReader();

            await new Promise(res => { reader.onload = res; reader.readAsDataURL(blob); });

            doc.addImage(reader.result, 'PNG', x, yPos, 14, 14);

        } catch(e) { /* logo non disponibile */ }

    };

    await Promise.all([

        caricaLogo(p.squadraA, 20, yBloccoRisultato),

        caricaLogo(p.squadraB, 176, yBloccoRisultato),

    ]);



    // Nomi squadre

    doc.setFontSize(13); doc.setTextColor(14,116,144);

    doc.text(p.squadraA, 36, yBloccoRisultato + 9);

    doc.text(p.squadraB, 174, yBloccoRisultato + 9, { align: 'right' });



    // Risultato al centro

    doc.setFontSize(24); doc.setTextColor(180,130,0);

    doc.text(`${p.punteggioA}  -  ${p.punteggioB}`, 105, yBloccoRisultato + 9, { align: 'center' });



    y = yBloccoRisultato + 18;

    y += 2;

doc.setFontSize(11);
doc.setFont(undefined, 'bold');
doc.setTextColor(80, 80, 80);

const yVuoti = y;
riga(`Vuoti sq.: ${p.vuotiSquadraA}   Falli difesa: ${p.falliDifesaTotA}`, 20, yVuoti);
y = riga(`Vuoti sq.: ${p.vuotiSquadraB}   Falli difesa: ${p.falliDifesaTotB}`, 110, yVuoti);
y += 4;


    // ── 5. LINEA ──

    doc.setDrawColor(14,116,144); doc.line(20, y, 190, y); y += 8;



    // ── 6. CONTENUTO SQUADRE (colonne dinamiche) ──

    // Raccoglie tutti gli eventi di una squadra in righe testo

    const righeSquadra = (gol, scalpi, vuoti, cartellini, mvp) => {

        const blocchi = [];



        const golReali = gol.filter(ev => !this._nomeGiocatore(ev).includes('META'));

        const mete     = gol.filter(ev =>  this._nomeGiocatore(ev).includes('META'));



        const formatta = ev => {

            const g   = this._nomeGiocatore(ev);

            const min = (typeof ev === 'object' && ev.minuto) ? ` [${ev.minuto} T${ev.tempo}]` : '';

            return g + min;

        };



        if (golReali.length)    blocchi.push({ titolo: `Gol (${golReali.length})`,       righe: golReali.map(formatta) });

        if (mete.length)        blocchi.push({ titolo: `Mete (${mete.length})`,           righe: mete.map(formatta) });

        if (scalpi.length)      blocchi.push({ titolo: `Scalpi (${scalpi.length})`,       righe: scalpi.map(formatta) });

        if (vuoti.length)       blocchi.push({ titolo: `Vuoti (${vuoti.length})`,         righe: vuoti.map(formatta) });

        if (cartellini.length)  blocchi.push({ titolo: `Cartellini (${cartellini.length})`, righe: cartellini.map(c => {

            const s = c.tipo==='giallo'?'[G]':c.tipo==='rosso'?'[R]':'[N]';

            const min = c.minuto ? ` [${c.minuto} T${c.tempo}]` : '';

            return `${s} ${c.giocatore}${min}`;

        })});

        if (mvp) blocchi.push({ titolo: `MVP`, righe: [mvp], mvp: true });



        return blocchi;

    };



    const blocchiA = righeSquadra(p.golA, p.scalpiA, p.vuotiA, p.cartelliniA, p.mvpA);

    const blocchiB = righeSquadra(p.golB, p.scalpiB, p.vuotiB, p.cartelliniB, p.mvpB);

    const maxBlocchi = Math.max(blocchiA.length, blocchiB.length);



    // Stampa i blocchi affiancati, blocco per blocco, riga per riga

    // Così se un blocco è più lungo dell'altro, la y avanza insieme

    for (let b = 0; b < maxBlocchi; b++) {

        const bA = blocchiA[b];

        const bB = blocchiB[b];

        const maxRighe = Math.max(bA ? bA.righe.length + 1 : 0, bB ? bB.righe.length + 1 : 0);



        y = check(y, maxRighe * 6 + 4);



        // Titolo blocco

        doc.setFontSize(9);

        if (bA) {

            doc.setFont(undefined, 'bold');

            doc.setTextColor(bA.mvp ? 100 : 0, bA.mvp ? 50 : 0, bA.mvp ? 180 : 0);

            doc.text(bA.titolo, 20, y);

        }

        if (bB) {

            doc.setFont(undefined, 'bold');

            doc.setTextColor(bB.mvp ? 100 : 0, bB.mvp ? 50 : 0, bB.mvp ? 180 : 0);

            doc.text(bB.titolo, 110, y);

        }

        doc.setFont(undefined, 'normal'); doc.setTextColor(0,0,0);

        y += 6;



        // Righe del blocco

        const maxR = Math.max(bA ? bA.righe.length : 0, bB ? bB.righe.length : 0);

        for (let r = 0; r < maxR; r++) {

            y = check(y, 6);

            doc.setFontSize(8.5);

            if (bA && bA.righe[r]) doc.text(`  ${bA.righe[r]}`, 20, y);

            if (bB && bB.righe[r]) doc.text(`  ${bB.righe[r]}`, 110, y);

            y += 5.5;

        }

        y += 3; // spazio tra blocchi

    }



    // ── 7. FOOTER su tutte le pagine ──

    const tot = doc.internal.getNumberOfPages();

    for (let i = 1; i <= tot; i++) {

        doc.setPage(i);

        doc.setFontSize(8); doc.setTextColor(150,150,150);

        doc.line(20, 280, 190, 280);

        doc.text(`Generato da 24OdG ® - All Rights Reserved | Pagina ${i} di ${tot}`, 105, 286, { align: 'center' });

    }



    if (soloBlob) return doc.output('blob');

    doc.save(`referto_${p.squadraA}_vs_${p.squadraB}_${new Date().toLocaleDateString('it-IT')}.pdf`);

},

async inviaRefertoTelegram(id) {
    const p = this.partite.find(x => x.id === id);
    if (!p) return;

    try {

        const pdfBlob  = await this.generaPDF(id, true);
        const nomeFile = `referto_${p.squadraA}_vs_${p.squadraB}.pdf`;

        const formData = new FormData();
        formData.append('document', pdfBlob, nomeFile);
        formData.append('caption',
            `📋 ${p.squadraA} ${p.punteggioA} - ${p.punteggioB} ${p.squadraB}\n` +
            `🏟 Campo ${p.campo} • ${p.orario}\n` +
            `📅 ${new Date().toLocaleDateString('it-IT')}`
        );

        const { data: risultato, error } = await supabase.functions.invoke('invia-telegram', { body: formData });
        if (error) {
            let dettaglio = error.message;
            try { const j = await error.context.json(); dettaglio = j.description || JSON.stringify(j); } catch (_) {}
            throw new Error(dettaglio);
        }

        if (risultato.ok) alert('✅ Referto inviato su Telegram!');
        else alert('❌ Errore Telegram: ' + risultato.description);
    } catch (e) {
        console.error('Errore invio Telegram:', e);
        alert('❌ Errore durante l\'invio del referto: ' + e.message);
    }
},

        handleAggiungiPartita() {
            if (!this.isOrganizzatore()) return;
            const campo    = parseInt(document.getElementById('campo').value);
            const orario   = document.getElementById('orario').value;
            const squadraA = document.getElementById('squadraA').value.trim();
            const squadraB = document.getElementById('squadraB').value.trim();
            if (!squadraA || !squadraB) { alert('❌ Seleziona entrambe le squadre!'); return; }

            document.getElementById('squadraA').value = '';
            document.getElementById('squadraB').value = '';
            document.getElementById('orario').value   = '';
