        /* ----------------------------------------------------------------
           3I — FORM PARTITA IN CORSO
           ---------------------------------------------------------------- */

        renderFormPartita() {
            const p = this.partite.find(x => x.id === this.partitaSelezionata);
            if (!p) return;

            const giocatoriA = this.squadre[p.squadraA] || [];
            const giocatoriB = this.squadre[p.squadraB] || [];

            const secondiMostrati = p.timerAttivo
                ? p.timerSecondi + Math.floor((Date.now() - p.timerTimestamp) / 1000)
                : p.timerSecondi;

            const durataBase  = p.timerTempo >= 3 ? DURATA_TEMPO_EXTRA : DURATA_TEMPO_STD;
            const recupero    = p.timerTempo === 1 ? p.recupero1Tempo : p.recupero2Tempo;
            const tempoTotale = durataBase + (recupero * 60);
            const percentuale = Math.min((secondiMostrati / tempoTotale) * 100, 100);

            const vuotiPerGiocatoreA = {};
            const vuotiPerGiocatoreB = {};
            p.vuotiA.forEach(v => { const n = this._nomeGiocatore(v); vuotiPerGiocatoreA[n] = (vuotiPerGiocatoreA[n]||0)+1; });
            p.vuotiB.forEach(v => { const n = this._nomeGiocatore(v); vuotiPerGiocatoreB[n] = (vuotiPerGiocatoreB[n]||0)+1; });

            const tempoLabel = p.timerTempo===1?'Tempo 1/2':p.timerTempo===2?'Tempo 2/2':p.timerTempo===3?'⚡ Silver Meta':'🥇 Golden Meta';

            const btnCambioTempo = p.timerTempo === 1 ? `
                <div class="mt-3 pt-3 border-t border-gray-600">
                    <button onclick="app.passaAlSecondoTempoManuale(${p.id})" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded font-bold text-sm border-2 border-indigo-400">⏭ Passa al 2° Tempo</button>
                </div>` :
            p.timerTempo === 2 ? `
                <div class="mt-3 pt-3 border-t border-gray-600">
                    ${p.punteggioA === p.punteggioB
                        ? `<button onclick="app.passaAllaSilverMeta(${p.id})" class="w-full bg-yellow-600 hover:bg-yellow-500 text-white px-3 py-2 rounded font-bold text-sm border-2 border-yellow-400">⚡ Silver Meta (parità)</button>`
                        : `<div class="text-xs text-gray-500 text-center py-1">Silver Meta non disponibile (non in parità)</div>`}
                </div>` :
            p.timerTempo === 3 ? `
                <div class="mt-3 pt-3 border-t border-gray-600">
                    ${p.punteggioA === p.punteggioB
                        ? `<button onclick="app.passaAllaGoldenMeta(${p.id})" class="w-full bg-amber-500 hover:bg-amber-400 text-white px-3 py-2 rounded font-bold text-sm border-2 border-amber-300">🥇 Golden Meta (ancora parità)</button>`
                        : `<div class="text-xs text-gray-500 text-center py-1">Golden Meta non disponibile (non in parità)</div>`}
                </div>` : '';

            document.getElementById('app').innerHTML = `
                <div class="max-w-6xl mx-auto p-4">
                    <button onclick="app.partitaSelezionata=null;app.rilasciaControlloPartita(${p.id});if(app.timerInterval)clearInterval(app.timerInterval);app.render()"
                        class="mb-6 text-cyan-400 hover:text-cyan-300 flex items-center gap-2 font-semibold">
                        ← Torna alla lista
                    </button>

                    <div class="bg-gray-800 rounded-lg p-6 shadow-xl border border-gray-700 mb-6">
                        <div class="flex justify-between items-start mb-4 flex-wrap gap-4">
                            <div>
                                <h1 class="text-2xl font-bold">Campo ${p.campo} • ${p.orario}</h1>
                                <p class="text-gray-400 mt-1 flex items-center gap-2">
    ${this.imgLogo(p.squadraA, 'w-6 h-6 object-contain')}
    ${p.squadraA}
    <span class="text-gray-600">vs</span>
    ${p.squadraB}
    ${this.imgLogo(p.squadraB, 'w-6 h-6 object-contain')}
</p>
                                ${p.arbitroAssegnato ? `<p class="text-blue-400 text-sm mt-1">👤 Arbitro: ${p.arbitroAssegnato}</p>` : ''}
                            </div>
                            <div>
                                ${p.completata ? `
                                    <div class="text-3xl font-bold text-yellow-400">${p.punteggioA} - ${p.punteggioB}</div>
                                    <span class="text-green-300 text-sm">✓ Completata</span>` : `
                                    <div class="bg-gray-700 rounded-lg p-4 text-center min-w-[200px]">
                                        <div id="timer-display" class="text-4xl font-bold ${p.timerAttivo?'text-red-400 timer-active':'text-cyan-400'} mb-2 font-mono">${this.formatoTempo(secondiMostrati)}</div>
                                        <div id="tempo-display" class="text-sm text-gray-300 mb-1">${tempoLabel}</div>
                                        <div id="recupero-display" class="text-xs text-orange-400 font-bold mb-3 ${secondiMostrati>DURATA_TEMPO_STD?'':'hidden'}">+${Math.floor((secondiMostrati-DURATA_TEMPO_STD)/60)+1}'</div>
                                        <div class="w-full bg-gray-600 rounded-full h-2 mb-3">
                                            <div id="progress-bar" class="progress-bar h-full ${percentuale>90?'bg-red-500':percentuale>75?'bg-orange-500':'bg-cyan-500'} rounded-full" style="width:${percentuale}%"></div>
                                        </div>
                                        <div class="flex gap-2 mb-2">
                                            ${!p.timerAttivo
                                                ? `<button onclick="app.avviaTimer(${p.id})" class="flex-1 bg-green-500 hover:bg-green-400 text-white px-3 py-2 rounded font-bold text-base border-2 border-green-300 shadow-lg">▶ ${p.timerSecondi>0?'Riprendi':'Avvia'}</button>`
                                                : `<button onclick="app.pausaTimer(${p.id})" class="flex-1 bg-orange-500 hover:bg-orange-400 text-white px-3 py-2 rounded font-bold text-base border-2 border-orange-300 shadow-lg">⏸ Pausa</button>`}
                                            ${p.timerSecondi>0||p.timerAttivo ? `<button onclick="app.fermaTimer(${p.id})" class="flex-1 bg-red-500 hover:bg-red-400 text-white px-3 py-2 rounded font-bold text-base border-2 border-red-300 shadow-lg">⏹ Reset</button>` : ''}
                                        </div>
                                        <div class="flex gap-2">
                                            ${[1,2,3].map(m=>`<button onclick="app.aggiungiRecupero(${p.id},${m})" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded text-xs">+${m}' rec</button>`).join('')}
                                        </div>
                                        ${recupero>0?`<div class="text-xs text-gray-400 mt-2">Recupero: ${recupero}'</div>`:''}
                                        ${btnCambioTempo}
                                    </div>`}
                            </div>
                        </div>
                    </div>

                    ${!p.completata ? `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            ${this.renderSezioneSegnata(p,'A',giocatoriA,vuotiPerGiocatoreA)}
                            ${this.renderSezioneSegnata(p,'B',giocatoriB,vuotiPerGiocatoreB)}
                        </div>
                        <div class="bg-gray-800 rounded-lg p-6 shadow-xl border border-gray-700">
                            <button onclick="app.finalizzaPartitaForm(${p.id})" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-6 rounded text-lg">
                                🏁 Finalizza Partita
                            </button>
                        </div>` : `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            ${this.renderRiepilogo(p,'A')}
                            ${this.renderRiepilogo(p,'B')}
                        </div>
                        <div class="text-center">
<div class="flex gap-3 justify-center">
    <button onclick="app.generaPDF(${p.id})" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded text-lg">📄 Scarica PDF</button>
    <button onclick="app.inviaRefertoTelegram(${p.id})" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded text-lg">✈️ Invia su Telegram</button>
</div>
                        </div>`}
                </div>`;
        },

        /* ----------------------------------------------------------------
           3J — SEZIONE SQUADRA (gol, scalpi, vuoti, cartellini, falli)
           ---------------------------------------------------------------- */

        renderSezioneSegnata(p, squadra, giocatori, vuotiPerGiocatore) {
            const nome       = p[`squadra${squadra}`];
            const gol        = p[`gol${squadra}`];
            const scalpi     = p[`scalpi${squadra}`];
            const vuoti      = p[`vuoti${squadra}`];
            const espulsi    = p[`espulsi${squadra}`];
            const cartellini = p[`cartellini${squadra}`];
            const stato = (gNome) => this._statoGiocatore(gNome, squadra, nome, p);

            const selGiocatori = (inputId, mostraCnt = false) => giocatori.length > 0
                ? `<select id="${inputId}" class="flex-1 bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white">
                       <option value="">-- Seleziona --</option>
                       ${giocatori.map(g => {
                           const gNome = `${g.numero} - ${g.nome}`;
                           const { disabilitato, motivo } = stato(gNome);
                           const cnt = mostraCnt ? (vuotiPerGiocatore[gNome]||0) : 0;
                           return `<option value="${gNome}" ${disabilitato?'disabled':''}>${gNome}${cnt>0?` (${cnt})`:''}${motivo?' '+motivo:''}</option>`;
                       }).join('')}
                   </select>`
                : `<input type="text" id="${inputId}" placeholder="Nome" class="flex-1 bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white">`;

            const vuotiSquadra = p[`vuotiSquadra${squadra}`];
            const falliDifesa  = p[`falliDifesa${squadra}`];
            const limiteVuoti  = p.timerTempo >= 3 ? LIMITE_VUOTI_EXTRA : LIMITE_VUOTI_STD;

            return `
            <div class="bg-gray-800 rounded-lg p-6 shadow-xl border border-gray-700">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-cyan-300">${nome}</h2>
                    <div class="text-4xl font-bold text-yellow-400">${p[`punteggio${squadra}`]}</div>
                </div>

                ${espulsi.length > 0 ? `
                    <div class="mb-6 bg-red-900 bg-opacity-30 border border-red-700 rounded-lg p-4">
                        <div class="flex items-center gap-2 mb-3"><span class="text-red-400 text-xl">🟥</span><span class="font-bold text-red-300">Espulsi (${espulsi.length})</span></div>
                        <div class="space-y-2">${espulsi.map(e=>`
                            <div class="bg-red-900 bg-opacity-40 rounded px-3 py-2 flex justify-between items-center">
                                <span class="text-red-200">${e}</span>
                                <button onclick="app.rientraEspulso(${p.id},'${squadra}','${e}')" class="text-green-400 hover:text-green-300 text-xs font-semibold">Rientra</button>
                            </div>`).join('')}
                        </div>
                    </div>` : ''}

                <!-- GOL -->
                <div class="mb-5">
                    <div class="flex items-center gap-2 mb-3"><span class="text-yellow-400 text-xl">⚽</span><span class="font-bold text-gray-200">Gol (${gol.length})</span></div>
                    <div class="flex gap-2 mb-2">${selGiocatori(`gol-${squadra}-${p.id}`)}
                        <button onclick="app.aggiungiElemento(${p.id},'${squadra}','gol')" class="bg-cyan-600 hover:bg-cyan-700 text-white px-4 py-2 rounded font-bold">+</button></div>
                    <div class="space-y-1 max-h-32 overflow-y-auto">
                        ${gol.map((ev,i)=>{
                            const g = this._nomeGiocatore(ev);
                            const min = typeof ev==='object'&&ev.minuto ? `<span class="text-gray-500 text-xs ml-1">${ev.minuto} T${ev.tempo}</span>` : '';
                            return `<div class="bg-gray-700 rounded px-3 py-1.5 flex justify-between items-center text-sm">
                                <span>⚽ ${g}${min}</span>
                                <button onclick="app.rimuoviElemento(${p.id},'${squadra}','gol',${i})" class="text-red-400 hover:text-red-300">✕</button>
                            </div>`;
                        }).join('')}
                    </div>
                </div>

                <!-- SCALPI -->
                <div class="mb-5">
                    <div class="flex items-center gap-2 mb-3"><span class="text-red-400 text-xl">🔪</span><span class="font-bold text-gray-200">Scalpi (${scalpi.length})</span></div>
                    <div class="flex gap-2 mb-2">${selGiocatori(`scalpo-${squadra}-${p.id}`)}
                        <button onclick="app.aggiungiElemento(${p.id},'${squadra}','scalpo')" class="bg-cyan-600 hover:bg-cyan-700 text-white px-4 py-2 rounded font-bold">+</button></div>
                    <div class="space-y-1 max-h-32 overflow-y-auto">
                        ${scalpi.map((ev,i)=>{
                            const s = this._nomeGiocatore(ev);
                            const min = typeof ev==='object'&&ev.minuto ? `<span class="text-gray-500 text-xs ml-1">${ev.minuto} T${ev.tempo}</span>` : '';
                            return `<div class="bg-gray-700 rounded px-3 py-1.5 flex justify-between items-center text-sm">
                                <span>🔪 ${s}${min}</span>
                                <button onclick="app.rimuoviElemento(${p.id},'${squadra}','scalpo',${i})" class="text-red-400 hover:text-red-300">✕</button>
                            </div>`;
                        }).join('')}
                    </div>
                </div>

                <!-- VUOTI -->
                <div class="mb-5">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="text-blue-400 text-xl">🔵</span>
                            <span class="font-bold text-gray-200">Vuoti (${vuoti.length})</span>
                            ${p.timerTempo>=3?`<span class="text-xs bg-yellow-600 text-white px-2 py-0.5 rounded-full">lim: ${limiteVuoti}</span>`:''}
                            <span class="text-xs ${vuotiSquadra>=SOGLIA_FALLO_VUOTI?'text-orange-400':'text-gray-500'}">
                                | Sq: ${vuotiSquadra} ${vuotiSquadra>=SOGLIA_FALLO_VUOTI?`(prox fallo al ${SOGLIA_FALLO_VUOTI+(Math.floor((vuotiSquadra-SOGLIA_FALLO_VUOTI)/3)+1)*3}°)`:`(${SOGLIA_FALLO_VUOTI-vuotiSquadra} al 1° fallo)`}
                            </span>
                        </div>
                        ${vuoti.length>0?`<button onclick="app.azzeraVuoti(${p.id},'${squadra}')" class="text-xs bg-orange-600 hover:bg-orange-700 text-white px-2 py-1 rounded">Azzera</button>`:''}
                    </div>
                    <div class="flex gap-2 mb-2">${selGiocatori(`vuoto-${squadra}-${p.id}`, true)}
                        <button onclick="app.aggiungiVuotoBtn(${p.id},'${squadra}')" class="bg-cyan-600 hover:bg-cyan-700 text-white px-4 py-2 rounded font-bold">+</button></div>
                    <div class="space-y-1 max-h-28 overflow-y-auto">
                        ${vuoti.map((ev,i)=>{
                            const v   = this._nomeGiocatore(ev);
                            const cnt = vuotiPerGiocatore[v]||0;
                            const min = typeof ev==='object'&&ev.minuto ? `<span class="text-gray-500 text-xs ml-1">${ev.minuto} T${ev.tempo}</span>` : '';
                            return `<div class="bg-gray-700 rounded px-3 py-1.5 flex justify-between items-center text-sm ${cnt>=limiteVuoti?'border border-red-500':''}">
                                <span>🔵 ${v}${min} ${cnt>=(limiteVuoti-1)?`<span class="text-orange-400 font-bold">(${cnt}/${limiteVuoti})</span>`:''}</span>
                                <button onclick="app.rimuoviElemento(${p.id},'${squadra}','vuoto',${i})" class="text-red-400 hover:text-red-300">✕</button>
                            </div>`;
                        }).join('')}
                    </div>
                </div>

                <!-- CARTELLINI -->
                <div class="mb-5 border-t border-gray-700 pt-5">
                    <div class="flex items-center gap-2 mb-3"><span class="text-xl">🟨</span><span class="font-bold text-gray-200">Cartellini</span></div>
                    <div class="mb-2">${selGiocatori(`cartellino-giocatore-${squadra}-${p.id}`)}</div>
                    <div class="flex gap-2 mb-2">
                        ${[['giallo','bg-yellow-500 hover:bg-yellow-400 text-black border-yellow-300','🟨'],
                           ['rosso', 'bg-red-600 hover:bg-red-500 text-white border-red-400',         '🟥'],
                           ['nero',  'bg-gray-900 hover:bg-gray-800 text-white border-gray-500',       '⬛']].map(([tipo,cls,ico])=>`
                            <button onclick="(()=>{const el=document.getElementById('cartellino-giocatore-${squadra}-${p.id}');const v=el.tagName==='SELECT'?el.value:el.value.trim();if(!v)return;app.aggiungiCartellino(${p.id},'${squadra}',v,'${tipo}');el.value='';})()"
                                class="flex-1 ${cls} px-2 py-2 rounded font-bold text-sm border-2">${ico}</button>`).join('')}
                    </div>
                    <div class="space-y-1 max-h-28 overflow-y-auto">
                        ${cartellini.map((c,i)=>`
                            <div class="rounded px-3 py-1.5 flex justify-between items-center text-sm ${c.tipo==='giallo'?'bg-yellow-900 bg-opacity-40 border border-yellow-700':c.tipo==='rosso'?'bg-red-900 bg-opacity-40 border border-red-700':'bg-gray-900 border border-gray-600'}">
                                <span class="${c.tipo==='giallo'?'text-yellow-200':c.tipo==='rosso'?'text-red-200':'text-gray-200'}">
                                    ${c.tipo==='giallo'?'🟨':c.tipo==='rosso'?'🟥':'⬛'} ${c.giocatore}
                                    ${c.minuto?`<span class="text-xs opacity-60 ml-1">${c.minuto} T${c.tempo}</span>`:''}
                                    <span class="text-xs opacity-60">(${c.tipo==='giallo'?'Escl. T'+c.tempo:c.tipo==='rosso'?'partita':'torneo'})</span>
                                </span>
                                <button onclick="app.rimuoviCartellino(${p.id},'${squadra}',${i})" class="text-red-400 hover:text-red-300 ml-2">✕</button>
                            </div>`).join('')}
                    </div>
                </div>

                <!-- FALLI DI DIFESA -->
                <div class="border-t border-gray-700 pt-5">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2"><span class="text-orange-400 text-xl">⚠️</span><span class="font-bold text-gray-200">Falli di Difesa</span></div>
                        <div class="text-2xl font-bold ${falliDifesa>=2?'text-red-400 animate-pulse':'text-orange-400'}">${falliDifesa}/${FALLI_PER_META}</div>
                    </div>
                    <button onclick="app.aggiungiFalloDifesa(${p.id},'${squadra}')"
                        class="w-full ${falliDifesa>=2?'bg-red-600 hover:bg-red-700':'bg-orange-600 hover:bg-orange-700'} text-white px-4 py-2 rounded font-bold">
                        + Aggiungi Fallo
                    </button>
                    ${falliDifesa===2?'<p class="text-xs text-red-400 mt-2 text-center font-bold animate-pulse">🚨 Prossimo fallo = METÀ!</p>':falliDifesa===1?'<p class="text-xs text-orange-400 mt-2 text-center">⚠️ 1 fallo registrato</p>':''}
                </div>
            </div>`;
        },

        /* ----------------------------------------------------------------
           3K — RIEPILOGO PARTITA COMPLETATA
           ---------------------------------------------------------------- */

        renderRiepilogo(p, squadra) {
            const nome     = p[`squadra${squadra}`];
            const gol      = p[`gol${squadra}`];
            const scalpi   = p[`scalpi${squadra}`];
            const cartellini = p[`cartellini${squadra}`];
            const mvp      = p[`mvp${squadra}`];

            return `
            <div class="bg-gray-800 rounded-lg p-6 shadow-xl border border-gray-700">
                <h2 class="text-2xl font-bold text-cyan-300 mb-4">${nome}</h2>
                <div class="text-4xl font-bold text-yellow-400 mb-6">${p[`punteggio${squadra}`]}</div>

                <div class="mb-5">
                    <div class="text-sm text-gray-400 mb-2">Gol: ${gol.length}</div>
                    <div class="bg-gray-700 rounded p-3 text-sm space-y-1">
                        ${gol.length>0 ? gol.map(ev=>{
                            const g   = this._nomeGiocatore(ev);
                            const min = typeof ev==='object'&&ev.minuto?`<span class="text-gray-500 text-xs ml-1">${ev.minuto} T${ev.tempo}</span>`:'';
                            return `<div class="${g.includes('META')?'text-orange-300':'text-cyan-300'}">${g.includes('META')?'🏅':'⚽'} ${g}${min}</div>`;
                        }).join('') : '<div class="text-gray-500">Nessun gol</div>'}
                    </div>
                </div>

                <div class="mb-5">
                    <div class="text-sm text-gray-400 mb-2">Scalpi: ${scalpi.length}</div>
                    <div class="bg-gray-700 rounded p-3 text-sm space-y-1">
                        ${scalpi.length>0 ? scalpi.map(ev=>{
                            const s   = this._nomeGiocatore(ev);
                            const min = typeof ev==='object'&&ev.minuto?`<span class="text-gray-500 text-xs ml-1">${ev.minuto} T${ev.tempo}</span>`:'';
                            return `<div class="text-red-300">🔪 ${s}${min}</div>`;
                        }).join('') : '<div class="text-gray-500">Nessuno scalpo</div>'}
                    </div>
                </div>

                ${cartellini.length>0?`
                <div class="mb-5">
                    <div class="text-sm text-gray-400 mb-2">Cartellini: ${cartellini.length}</div>
                    <div class="bg-gray-700 rounded p-3 text-sm space-y-1">
                        ${cartellini.map(c=>`
                            <div class="${c.tipo==='giallo'?'text-yellow-300':c.tipo==='rosso'?'text-red-300':'text-gray-300'}">
                                ${c.tipo==='giallo'?'🟨':c.tipo==='rosso'?'🟥':'⬛'} ${c.giocatore}
                                ${c.minuto?`<span class="text-xs opacity-60 ml-1">${c.minuto} T${c.tempo}</span>`:''}
                            </div>`).join('')}
                    </div>
                </div>`:''}

                ${mvp?`
                <div class="bg-purple-900 bg-opacity-40 border border-purple-700 rounded-lg p-4">
                    <div class="text-sm text-gray-400 mb-1">MVP</div>
                    <div class="text-lg font-bold text-purple-300">⭐ ${mvp}</div>
                </div>`:''}
            </div>`;
        },

        /* ----------------------------------------------------------------
           3L — FORM FINALIZZAZIONE
           ---------------------------------------------------------------- */

        finalizzaPartitaForm(id) {
            const p          = this.partite.find(x => x.id === id);
            const giocatoriA = this.squadre[p.squadraA] || [];
            const giocatoriB = this.squadre[p.squadraB] || [];

            const selMvp = (inputId, giocatori) => `
                <select id="${inputId}" class="w-full bg-gray-700 border border-gray-600 rounded px-4 py-2 text-white mb-3">
                    <option value="">-- Nessun MVP --</option>
                    ${giocatori.map(g=>`<option value="${g.numero} - ${g.nome}">${g.numero} - ${g.nome}</option>`).join('')}
                </select>`;

            document.getElementById('app').innerHTML = `
                <div class="max-w-2xl mx-auto p-4">
                    <button onclick="app.partitaSelezionata=${id};app.render()"
                        class="mb-6 text-cyan-400 hover:text-cyan-300 flex items-center gap-2 font-semibold">← Torna al form</button>
                    <div class="bg-gray-800 rounded-lg p-6 shadow-xl border border-gray-700 mb-6">
                        <h1 class="text-2xl font-bold mb-1">Finalizza Partita</h1>
                        <p class="text-gray-400">${p.squadraA} vs ${p.squadraB}</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div class="bg-gray-800 rounded-lg p-6 shadow-xl border border-gray-700">
                            <h2 class="text-xl font-bold text-cyan-300 mb-4">${p.squadraA}</h2>
                            <label class="block text-sm mb-2 text-gray-300">Seleziona MVP</label>
                            ${selMvp('mvp-select-a', giocatoriA)}
                            <div id="preview-a" class="text-sm text-gray-400"></div>
                        </div>
                        <div class="bg-gray-800 rounded-lg p-6 shadow-xl border border-gray-700">
                            <h2 class="text-xl font-bold text-cyan-300 mb-4">${p.squadraB}</h2>
                            <label class="block text-sm mb-2 text-gray-300">Seleziona MVP</label>
                            ${selMvp('mvp-select-b', giocatoriB)}
                            <div id="preview-b" class="text-sm text-gray-400"></div>
                        </div>
                    </div>
                    <button onclick="app.confermaSalvaPartita(${id})"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-6 rounded text-lg">
                        ✓ Salva e Finalizza
                    </button>
                </div>`;

            document.getElementById('mvp-select-a').addEventListener('change', e =>
                document.getElementById('preview-a').textContent = e.target.value ? `⭐ ${e.target.value}` : '');
            document.getElementById('mvp-select-b').addEventListener('change', e =>
                document.getElementById('preview-b').textContent = e.target.value ? `⭐ ${e.target.value}` : '');
        },

        // =============================================================
        // FINE PARTE 3 — chiusura oggetto app e avvio
        // =============================================================

        }; // fine window.app

        window.addEventListener('DOMContentLoaded', () => {
            app.init();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(() => console.log('✓ PWA pronta'))
                    .catch(err => console.log('Service Worker:', err));
            }
        });

    </script>
</body>
</html>
